[project]
name = "pythonproject30-1"
version = "0.1.0"
description = "Проект на Python 3.11 с Django 5.x"
authors = [
    {name = "Your Name", email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "django<6",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "celery (>=5.6.2,<6.0.0)",
    "environs (>=14.5.0,<15.0.0)"
]

[tool.poetry]
packages = [{include = "pythonproject30"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
